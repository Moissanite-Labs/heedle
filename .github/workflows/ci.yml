name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python3 -m pip install numpy==2.5.4
      - name: Python reference, both hosts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript mirror, against the same vectors
        run: node --test web/test_heedle.mjs
      - name: Recorded sessions replay
        run: |
          python3 -m heedle verify drafts/sample-cloth.json
          python3 -m heedle verify drafts/sample-text.json
      - name: The hosts are the ones on record
        run: python3 -m heedle hosts
